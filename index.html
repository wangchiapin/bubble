body{min-height:100vh;min-height:100dvh}

.btn.small{padding:5px 9px;font-size:13px}
.btn.danger{color:var(--warn);border-color:var(--warn)}

.chip.on{background:var(--ink);color:var(--panel)}
.pill{display:inline-block;border:1.5px solid var(--line);border-radius:999px;padding:3px 10px;font-size:13px;background:var(--panel)}
.pill.live{background:var(--ok);color:#fff;border-color:var(--ok)}
.code{font-size:20px;font-weight:700;letter-spacing:.2em}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.note{color:var(--mute);font-size:13px}

.home{max-width:520px;margin:8vh auto 0;text-align:center}
.home h1{font-size:34px;letter-spacing:.1em;margin:0 0 4px}
.home p{color:var(--mute);margin:0 0 26px}
.home .btn{display:block;width:100%;padding:16px;font-size:18px;margin-bottom:12px}
.join{display:flex;gap:8px;margin-top:6px}
.home .join .btn{display:block;width:auto;flex:none;margin:0;padding:10px 26px}
.join input,.pwin{flex:1 1 auto;width:100%;font-size:24px;letter-spacing:.25em;text-align:center;border:1.5px solid var(--line);border-radius:6px;background:#fffdf7;padding:10px;min-width:0}
.err{color:var(--warn);min-height:22px;margin-top:8px;font-size:14px}

.ctl{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:8px}
.ctl .sl{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--mute)}

.sec{border:1.5px solid var(--line);border-radius:8px;background:var(--panel);padding:10px 12px;margin-bottom:10px}
.sec h2{font-size:15px;margin:0 0 8px;letter-spacing:.05em}
.sec .g{margin-bottom:10px}
textarea{width:100%;min-height:96px;border:1.5px solid var(--line);border-radius:6px;background:#fffdf7;padding:8px;font-size:15px;resize:vertical}

.bub .bt{font-weight:600}
.bub.enter .bi{animation:enter .35s ease-out}
.bub.shake .bi{animation:shake .35s}
.bub.pop{pointer-events:none}
.bub.pop .bi{animation:pop .36s ease-out forwards}

const HAN_RE = /[㐀-鿿]/;
function parseWords(text) {
  const out = [];
  for (let line of String(text || '').replace(/\r/g, '').split('\n')) {
    line = line.trim().replace(/＝/g, '=');
    if (!line) continue;
    let pieces;
    if (/[,，、;；]/.test(line)) pieces = line.split(/[,，、;；]/);
    else if (HAN_RE.test(line)) {
      pieces = [];   // 中文用空白分開；配對的西文翻譯裡有空白（buenos días）時，接在前一個配對後面
      line.split(/\s+/).forEach((tok) => {
        if (tok.includes('=') || HAN_RE.test(tok) || !pieces.length || !pieces[pieces.length - 1].includes('=')) pieces.push(tok);
        else pieces[pieces.length - 1] += ' ' + tok;

      const parts = p.split('=').map((x) => x.trim());

      const tr = parts.slice(1).filter(Boolean);
      out.push({ main, k: HAN_RE.test(main) ? 'zh' : 'lat', tr: tr.length ? tr : null });
    }

}

function tmShow() { const x = D.tm; if (!x.k) return null; const e = tmElapsed(); return x.k === 'd' ? Math.max(0, x.total - e) : e; }

async function openRoom() {
  if (roomBusy || room) return;

  try {
    const doc = JSON.parse(JSON.stringify(D)); doc.ts = Date.now();
    const code = await Sync.create(doc); room = { code };

  } catch (e) { toast(t('connFail')); console.error(e); }
  roomBusy = false; renderBar();
}
async function endRoom() { if (!room) return; const c = room.code; try { room.unsub && room.unsub(); } catch (e) {} room = null; try { await Sync.close(c); } catch (e) {} renderBar(); }
function mergeRemote(d) {
  if (!d || !d.rd || d.rd.n !== D.rd.n) return;
  let ch = false;
  (d.rd.popped || []).forEach((s) => { if (!D.rd.popped.includes(s) && !undone.has(s)) { D.rd.popped.push(s); assignTeam(s.slice(s.indexOf(':') + 1)); ch = true; if (D.set.mode === 'match') nextAdv = now() + 650; } });
  (d.rd.miss || []).forEach((s) => { if (!D.rd.miss.includes(s)) { D.rd.miss.push(s); ch = true; } });

async function joinRoom(code) {
  sErr = ''; D = null; sCode = code; localPop.clear(); dismissedN = -1;
  if (sUnsub) { try { sUnsub(); } catch (e) {} sUnsub = null; }
  role = 'student'; skew = 0; renderRoot();
  try {
    sUnsub = await Sync.subscribe(code, (d, pending) => {
      if (!d) { sErr = D ? t('expired') : t('badRoom'); D = null; renderRoot(); return; }
      if (!pending && d.ts) { const sk = Date.now() - d.ts; if (!window.__skewSet || sk < skew) { skew = sk; window.__skewSet = true; } }
      const old = D; D = d; sErr = '';
      if (old && old.words) d.words.forEach((w) => { const ow = old.words.find((x) => x.id === w.id); if (ow && ow.m && w.m && ow.m.born !== w.m.born) localPop.delete(w.id); });
      if (!old || !old.rd || old.rd.n !== d.rd.n) { localPop.clear(); dismissedN = -1; }
      if (!old) renderRoot(); else renderStudentParts();
    }, () => { sErr = t('connFail'); renderRoot(); });
  } catch (e) { sErr = t('connFail'); renderRoot(); }
}
function leaveStudent() { if (sUnsub) { try { sUnsub(); } catch (e) {} sUnsub = null; } D = null; sCode = null; sErr = ''; role = null; window.__skewSet = false; skew = 0; renderRoot(); }
function popStudent(id, el) {
  if (!D || D.rd.st !== 'run') return;
  const mode = D.set.mode; if (mode === 'say') return;
  if (poppedIds().includes(id) || localPop.has(id)) return;
  if (mode === 'match') {

  localPop.add(id);

  renderLists();
}

function teamRank() {

/* ================= 把複習清單輸出成圖片（老師、學生都可以） ================= */
function buildReviewCanvas() {
  const W = wmap(), items = (D.rd.rv || []).map((id) => W.get(id)).filter(Boolean).slice(0, 80), sc = SC();
  const FONT = '"Noto Sans TC","PingFang TC","Microsoft JhengHei","Noto Sans SC","PingFang SC",system-ui,sans-serif';
  const cw = 1080, pad = 56, gap = 24, cardW = (cw - pad * 2 - gap) / 2, cardH = 170, head = 150;
  const rows = Math.max(1, Math.ceil(items.length / 2)), ch = head + rows * (cardH + gap) + 70;
  const cv = document.createElement('canvas'); cv.width = cw * 2; cv.height = ch * 2;
  const g = cv.getContext('2d'); g.scale(2, 2);
  g.fillStyle = '#e8e1d3'; g.fillRect(0, 0, cw, ch);
  g.fillStyle = '#1f1d1a'; g.textBaseline = 'alphabetic';
  g.font = '700 46px ' + FONT; g.fillText(t('imgTitle'), pad, 84);
  g.font = '400 24px ' + FONT; g.fillStyle = '#6a6457';
  const d = new Date(); g.fillText(d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0') + '  ·  ' + items.length, pad, 122);
  const fit = (txt, size, weight, maxW) => { let sz = size; g.font = weight + ' ' + sz + 'px ' + FONT; while (g.measureText(txt).width > maxW && sz > 14) { sz -= 2; g.font = weight + ' ' + sz + 'px ' + FONT; } return sz; };
  items.forEach((w, i) => {
    const x = pad + (i % 2) * (cardW + gap), y = head + Math.floor(i / 2) * (cardH + gap);
    g.fillStyle = '#fffdf7'; g.fillRect(x, y, cardW, cardH); g.strokeStyle = '#2a2722'; g.lineWidth = 1.5; g.strokeRect(x, y, cardW, cardH);
    g.textAlign = 'center'; const cx = x + cardW / 2, mw = cardW - 36;
    const a = w.k === 'zh' ? (D.set.ann === 'py' ? w.py : D.set.ann === 'zy' ? w.zy : '') : '';
    const main = sc ? w.sc : w.tc, tr = (w.tr || []).join(' / ');
    let yy = y + (a ? 38 : 30);
    if (a) { fit(a, 24, '400', mw); g.fillStyle = '#6a6457'; g.fillText(a, cx, yy); yy += 6; }
    const msz = fit(main, 58, '600', mw); g.fillStyle = '#1f1d1a'; g.fillText(main, cx, yy + msz * 0.95);
    if (tr) { fit(tr, 26, '400', mw); g.fillStyle = '#6a6457'; g.fillText(tr, cx, y + cardH - 18); }
  });
  g.textAlign = 'right'; g.font = '400 20px ' + FONT; g.fillStyle = '#6a6457'; g.fillText(t('title'), cw - pad, ch - 26);
  return cv;
}
function reviewBlob() { return new Promise((res) => buildReviewCanvas().toBlob(res, 'image/png')); }
async function saveReviewImage() {
  if (!D || !(D.rd.rv || []).length) return;
  const blob = await reviewBlob(); if (!blob) return;
  const d = new Date(), name = 'repaso-' + d.getFullYear() + String(d.getMonth() + 1).padStart(2, '0') + String(d.getDate()).padStart(2, '0') + '.png';
  const file = new File([blob], name, { type: 'image/png' });
  try { if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], title: t('imgTitle') }); return; } } catch (e) { if (e && e.name === 'AbortError') return; }
  const url = URL.createObjectURL(blob), a = document.createElement('a'); a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 4000);
}

/* ================= 泡泡畫面（每一格都由時間算出位置） ================= */
const els = new Map();
const lb = new Map(); let lbN = -1;
let FW = 0, FH = 0, ro = null;
function fieldReset() {
  els.clear(); FW = FH = 0;
  const f = $('#field'); if (!f) return;
  if (ro) ro.disconnect();
  ro = new ResizeObserver(() => { const r = f.getBoundingClientRect(); FW = r.width; FH = r.height; els.forEach((el) => { el._sig = ''; }); });
  ro.observe(f);
  const r = f.getBoundingClientRect(); FW = r.width; FH = r.height;
}
function bubbleDiam() { return Math.round(Math.min(FW, FH) * (0.10 + D.set.size * 0.03)); }
function annOf(w) { return w.k === 'zh' ? (D.set.ann === 'py' ? w.py : D.set.ann === 'zy' ? w.zy : '') : ''; }
function fitLat(len, Dp) { return Math.max(11, Math.min(Dp * 0.22, Dp * 1.5 / Math.max(len, 1))).toFixed(1); }
function bubbleInner(w, Dp) {
  if (D.set.mode === 'match') { const tr = w.tr || []; const L = Math.max(1, ...tr.map((x) => x.length)); return '<div class="bt" style="font-size:' + fitLat(L, Dp) + 'px">' + tr.map((x) => '<div>' + esc(x) + '</div>').join('') + '</div>'; }
  if (w.k === 'lat') return '<div class="bt" style="font-size:' + fitLat(w.tc.length, Dp) + 'px">' + esc(w.tc) + '</div>';
  const txt = SC() ? w.sc : w.tc, chars = Array.from(txt), n = chars.length, lines = n > 6 ? 2 : 1, per = Math.ceil(n / lines);
  const fs = Math.max(12, Math.min(Dp * 0.34, Dp * 0.78 / per));
  const a = annOf(w); let ah = '';
  if (a) { const afs = Math.max(9, Math.min(fs * 0.45, (Dp * 0.9) / (a.length * 0.6))); ah = '<div class="ba" style="font-size:' + afs.toFixed(1) + 'px">' + esc(a) + '</div>'; }
  const body = lines === 2 ? esc(chars.slice(0, per).join('')) + '<br>' + esc(chars.slice(per).join('')) : esc(txt);
  return ah + '<div class="bh" style="font-size:' + fs.toFixed(1) + 'px">' + body + '</div>';
}
function frame() {
  requestAnimationFrame(frame);
  if (!D || (role !== 'teacher' && role !== 'student')) return;
  const f = $('#field'); if (!f) return;
  /* 計時文字 */
  const tt = $('#tmTxt');
  if (tt && D.tm.k) { const v = tmShow(); tt.textContent = fmt(v); tt.classList.toggle('up', D.tm.k === 'd' && v <= 0); }
  if (role === 'teacher') teacherLogic();
  if (!FW || !FH) { const r = f.getBoundingClientRect(); FW = r.width; FH = r.height; }
  const W = wmap(), vis = visibleIds(), vset = new Set(vis);
  const pset = new Set(poppedIds()); if (role === 'student') localPop.forEach((id) => pset.add(id));
  /* 已經不在畫面的泡泡：被戳破就播破掉的效果 */
  els.forEach((el, id) => {
    if (vset.has(id) && !pset.has(id)) return;
    els.delete(id);
    if (pset.has(id)) { el.classList.add('pop'); sndPop(); setTimeout(() => el.remove(), 400); } else el.remove();
  });
  const idle = D.rd.st === 'idle';
  let msg = f.querySelector('.msg');
  if (idle || !D.words.length) { if (!msg) { msg = document.createElement('div'); msg.className = 'msg'; f.appendChild(msg); } msg.textContent = role === 'teacher' ? t('pressStart') : t('waitT'); }
  else if (msg) msg.remove();
  if (!vis.length) return;
  const T0 = effT(), Dp = bubbleDiam();
  if (lbN !== D.rd.n) { lb.clear(); lbN = D.rd.n; }
  for (const id of vis) {
    if (pset.has(id)) continue;
    const w = W.get(id); if (!w || !w.m) continue;
    let el = els.get(id);
    let isNew = false;
    if (!el) { isNew = true; el = document.createElement('div'); el.className = 'bub b' + (w.m.c % 4) + ' enter'; el.dataset.id = id; el.innerHTML = '<div class="bi"></div>'; f.appendChild(el); els.set(id, el); setTimeout(() => el.classList.remove('enter'), 400); }
    const sig = [D.set.mode, D.set.script, D.set.ann, Dp, w.tc, w.py, w.zy, (w.tr || []).join('|')].join('~');
    if (el._sig !== sig) { el._sig = sig; el.style.width = el.style.height = Dp + 'px'; el.firstChild.innerHTML = bubbleInner(w, Dp); }
    if (isNew && D.set.cap > 0 && D.rd.order.indexOf(id) >= D.set.cap && T0 - w.m.born > 0.5) lb.set(id, T0);   // 排隊後才上場的，從邊緣飛進來
    const u = Math.max(0, T0 - (lb.has(id) ? lb.get(id) : w.m.born));
    const px = posAt(w.m.x0, w.m.vx, u), py = posAt(w.m.y0, w.m.vy, u);
    el.style.transform = 'translate3d(' + (px * (FW - Dp)).toFixed(1) + 'px,' + (py * (FH - Dp)).toFixed(1) + 'px,0)';
  }
}
function teacherLogic() {
  const rd = D.rd;
  /* 倒數到 0 就結束本輪 */
  if (D.tm.k === 'd' && D.tm.run && tmElapsed() >= D.tm.total) {
    D.tm = { k: 'd', total: D.tm.total, base: D.tm.total, at: now(), run: false }; push(['tm']); renderTimer();
    if (rd.st === 'run') endRound('time');
  }
  if (rd.st !== 'run') return;
  /* 全部破掉了就結束本輪 */
  if (!remainingIds().length) { endRound('done'); return; }
  /* 配對：換下一題 */
  if (D.set.mode === 'match') {
    const tgtPopped = rd.target && poppedIds().includes(rd.target);
    if ((tgtPopped || !rd.target) && now() >= nextAdv) { pickTarget(false); }
  }
}

    case 'home': if (role === 'teacher') { if (room && !confirm(t('endRoom') + '？')) break; await endRoom(); } role = null; sErr = ''; renderRoot(); break;
    case 'leave': leaveStudent(); break;
